<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. UPRIT 2026 - Monedas y Billetes</title>
    <style>
        :root {
            --primary: #4338ca;
            --success: #16a34a;
            --error: #dc2626;
            --gold: #f59e0b;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        #workshop {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        #print-view {
            display: none;
            background: white;
            width: 210mm; 
            min-height: 297mm;
            padding: 15mm;
            margin: auto;
            box-sizing: border-box;
        }

        .header-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            max-height: 180px;
            object-fit: cover;
        }

        .manual-name {
            text-align: left;
            margin-bottom: 20px;
            background: #f3f4f6;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .manual-name input {
            flex-grow: 1;
            border: none;
            border-bottom: 2px dotted #9ca3af;
            background: transparent;
            font-size: 1.1rem;
            padding: 5px;
            outline: none;
            color: var(--primary);
        }

        .problem-card {
            background: #f9fafb;
            border: 3px solid #f3f4f6;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .money-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #ccc;
        }

        /* Estilo visual de monedas y billetes */
        .billete {
            width: 80px;
            height: 40px;
            background: #dcfce7;
            border: 2px solid #166534;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #166534;
            border-radius: 4px;
            box-shadow: 2px 2px 0px #bbb;
        }

        .moneda {
            width: 40px;
            height: 40px;
            background: #fef3c7;
            border: 2px solid #92400e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #92400e;
            box-shadow: 2px 2px 0px #bbb;
        }

        .input-area {
            font-size: 1.2rem;
            color: #333;
        }

        .input-area input {
            width: 80px;
            height: 40px;
            text-align: center;
            font-size: 1.3rem;
            border: 2px solid var(--primary);
            border-radius: 10px;
            outline: none;
        }

        .btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
        }

        #print-results-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .report-row {
            border-bottom: 1px solid #eee;
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
        }

        @media print {
            body { background: white; padding: 0; }
            #workshop { display: none !important; }
            #print-view { display: block !important; }
            .no-print { display: none !important; }
            @page { margin: 1cm; }
        }
    </style>
</head>
<body onload="crearExamen()">

    <div id="workshop">
        <img src="img/logo.jpg" class="header-img">
        
        <div class="manual-name">
            <strong>Estudiante:</strong>
            <input type="text" id="student-name-input" placeholder="Escribe tu nombre aquí...">
        </div>

        <h2 style="color: var(--primary); margin-bottom: 5px;">Manejo de Dinero</h2>
        <p style="font-size: 1rem; color: #444;">Suma los billetes y monedas para saber cuánto dinero hay.</p>

        <div id="exercise-container"></div>

        <button class="btn" id="btn-finish" onclick="calcularNota()">Entregar y Ver Nota</button>
        
        <div class="school-footer" style="margin-top:20px; font-size:0.8rem; color:#888;">
            I.E. UPRIT 2026
        </div>
    </div>

    <div id="print-view">
        <div style="text-align:center; border-bottom: 4px solid var(--primary); padding-bottom: 10px;">
            <h1 style="margin:0; color:var(--primary); font-family: Arial;">REPORTE DE EVALUACIÓN</h1>
            <h3 style="margin:5px 0; font-family: Arial;">I.E. UPRIT 2026 - Monedas y Billetes</h3>
        </div>

        <div style="margin: 20px 0; font-family: Arial; display: flex; justify-content: space-between;">
            <span><strong>Estudiante:</strong> <span id="print-student-name"></span></span>
            <span><strong>Fecha:</strong> <span id="print-date"></span></span>
        </div>

        <h4 style="font-family: Arial; border-bottom: 1px solid #ccc; margin-bottom: 10px;">Resultados de los 10 ejercicios:</h4>
        <div id="print-results-list"></div>

        <div style="margin-top: 20px; padding: 20px; border: 3px solid var(--gold); border-radius: 15px; text-align: center; font-family: Arial;">
            <h2 style="margin:0;">CALIFICACIÓN FINAL</h2>
            <div style="font-size: 4rem; font-weight: bold; color: var(--gold);" id="print-score">0 / 20</div>
            <p id="print-feedback" style="font-size: 1.2rem; font-weight: bold;"></p>
        </div>

        <div class="no-print" style="text-align:center; margin-top:30px;">
            <button class="btn" onclick="window.print()">🖨️ Imprimir Reporte</button>
            <button class="btn" style="background:#6b7280" onclick="location.reload()">Nuevo Examen</button>
        </div>
    </div>

<script>
    let answersKey = [];

    function crearExamen() {
        const container = document.getElementById('exercise-container');
        container.innerHTML = "";
        answersKey = [];

        const items = ["🧸", "🚗", "🍕", "🍦", "📚", "👟", "🎨", "🎮", "🚲", "🍫"];

        for(let i=0; i<10; i++) {
            // Generar una combinación de dinero
            let b10 = Math.floor(Math.random() * 3); // Billetes de 10
            let m5 = Math.floor(Math.random() * 3);  // Monedas de 5
            let m1 = Math.floor(Math.random() * 6);  // Monedas de 1
            
            let total = (b10 * 10) + (m5 * 5) + (m1 * 1);
            if (total === 0) { b10 = 1; total = 10; } // Evitar 0

            answersKey.push(total);

            let moneyHtml = '';
            for(let b=0; b<b10; b++) moneyHtml += '<div class="billete">S/ 10</div>';
            for(let m=0; m<m5; m++) moneyHtml += '<div class="moneda">5</div>';
            for(let m=0; m<m1; m++) moneyHtml += '<div class="moneda">1</div>';

            container.innerHTML += `
                <div class="problem-card">
                    <div style="font-size: 1.2rem; font-weight: bold;">${items[i]} Precio del objeto</div>
                    <div class="money-container">${moneyHtml}</div>
                    <div class="input-area">
                        ¿Cuánto dinero hay? <strong>S/</strong> <input type="number" id="v-${i}">
                    </div>
                </div>
            `;
        }
    }

    function calcularNota() {
        let ejerciciosCorrectos = 0;
        const studentName = document.getElementById('student-name-input').value || "Invitado";
        const resultsList = document.getElementById('print-results-list');
        resultsList.innerHTML = ""; 

        answersKey.forEach((resCorrecta, i) => {
            const v = parseInt(document.getElementById(`v-${i}`).value);

            const esCorrecto = (v === resCorrecta);
            if(esCorrecto) ejerciciosCorrectos++;

            resultsList.innerHTML += `
                <div class="report-row" style="font-family: Arial;">
                    <span>Ejercicio ${i+1}: Tu respuesta: S/ ${v || 0}</span>
                    <span style="color:${esCorrecto ? 'green' : 'red'}; font-weight:bold">
                        ${esCorrecto ? '✓' : '✗ (Era S/ ' + resCorrecta + ')'}
                    </span>
                </div>
            `;
        });

        const notaFinal = ejerciciosCorrectos * 2;
        document.getElementById('print-student-name').innerText = studentName;
        document.getElementById('print-date').innerText = new Date().toLocaleDateString();
        document.getElementById('print-score').innerText = notaFinal + " / 20";
        
        const feedback = document.getElementById('print-feedback');
        if(notaFinal === 20) feedback.innerText = "¡EXCELENTE ECONOMISTA! 💰🏆";
        else if(notaFinal >= 12) feedback.innerText = "¡Muy bien! Sabes contar tu dinero. 👍";
        else feedback.innerText = "Suma con calma los billetes de 10 y las monedas. 💪";

        document.getElementById('workshop').style.display = 'none';
        document.getElementById('print-view').style.display = 'block';
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
