<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. UPRIT 2026 - Perímetros</title>
    <style>
        :root {
            --primary: #4338ca;
            --success: #16a34a;
            --error: #dc2626;
            --gold: #f59e0b;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        #workshop {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        #print-view {
            display: none;
            background: white;
            width: 210mm; 
            min-height: 297mm;
            padding: 15mm;
            margin: auto;
            box-sizing: border-box;
        }

        .header-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            max-height: 180px;
            object-fit: cover;
        }

        .manual-name {
            text-align: left;
            margin-bottom: 20px;
            background: #f3f4f6;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .manual-name input {
            flex-grow: 1;
            border: none;
            border-bottom: 2px dotted #9ca3af;
            background: transparent;
            font-size: 1.1rem;
            padding: 5px;
            outline: none;
            color: var(--primary);
        }

        .problem-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .problem-card {
            background: #f9fafb;
            border: 3px solid #f3f4f6;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shape-container {
            width: 150px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
            background: white;
            border-radius: 10px;
        }

        .measure-label {
            position: absolute;
            font-size: 0.8rem;
            font-weight: bold;
            color: #444;
            background: rgba(255,255,255,0.8);
            padding: 1px 3px;
        }

        .input-area {
            margin-top: 5px;
            font-size: 1rem;
        }

        .input-area input {
            width: 60px;
            height: 35px;
            text-align: center;
            font-size: 1.2rem;
            border: 2px solid var(--primary);
            border-radius: 8px;
        }

        .btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            margin: 20px;
        }

        .report-row {
            border-bottom: 1px solid #eee;
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
        }

        @media print {
            body { background: white; padding: 0; }
            #workshop { display: none !important; }
            #print-view { display: block !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body onload="crearExamen()">

    <div id="workshop">
        <img src="img/logo.jpg" class="header-img">
        
        <div class="manual-name">
            <strong>Estudiante:</strong>
            <input type="text" id="student-name-input" placeholder="Nombre...">
        </div>

        <h2 style="color: var(--primary); margin-bottom: 5px;">Calculando Perímetros</h2>
        <p style="font-size: 0.9rem; color: #666;">El perímetro es la suma de todos los lados. ¡A sumar!</p>

        <div id="exercise-container" class="problem-grid"></div>

        <button class="btn" onclick="calcularNota()">Entregar y Ver Nota</button>
    </div>

    <div id="print-view">
        <div style="text-align:center; border-bottom: 4px solid var(--primary); padding-bottom: 10px;">
            <h1 style="margin:0; color:var(--primary); font-family: Arial;">REPORTE DE EVALUACIÓN</h1>
            <h3 style="margin:5px 0; font-family: Arial;">I.E. UPRIT 2026 - Perímetros</h3>
        </div>
        <div style="margin: 20px 0; font-family: Arial; display: flex; justify-content: space-between;">
            <span><strong>Estudiante:</strong> <span id="print-student-name"></span></span>
            <span><strong>Fecha:</strong> <span id="print-date"></span></span>
        </div>
        <div id="print-results-list"></div>
        <div style="margin-top: 20px; padding: 20px; border: 3px solid var(--gold); border-radius: 15px; text-align: center; font-family: Arial;">
            <h2 style="margin:0;">CALIFICACIÓN FINAL</h2>
            <div style="font-size: 4rem; font-weight: bold; color: var(--gold);" id="print-score">0 / 20</div>
            <p id="print-feedback" style="font-size: 1.2rem; font-weight: bold;"></p>
        </div>
        <div class="no-print" style="text-align:center; margin-top:30px;">
            <button class="btn" onclick="window.print()">🖨️ Imprimir Reporte</button>
            <button class="btn" style="background:#6b7280" onclick="location.reload()">Nuevo Examen</button>
        </div>
    </div>

<script>
    let answersKey = [];

    function crearExamen() {
        const container = document.getElementById('exercise-container');
        container.innerHTML = "";
        answersKey = [];

        for(let i=0; i<10; i++) {
            const tipo = Math.floor(Math.random() * 3); // 0: Cuadrado, 1: Rectángulo, 2: Triángulo
            let htmlShape = '';
            let perimetro = 0;

            if(tipo === 0) { // Cuadrado
                const lado = Math.floor(Math.random() * 8) + 2;
                perimetro = lado * 4;
                htmlShape = `<div style="width:60px; height:60px; border:3px solid var(--primary); background:#eef2ff"></div>
                             <span class="measure-label" style="top:50%; left:25%">${lado}u</span>
                             <span class="measure-label" style="top:20%; left:50%">${lado}u</span>`;
            } else if(tipo === 1) { // Rectángulo
                const base = Math.floor(Math.random() * 6) + 5;
                const altura = Math.floor(Math.random() * 3) + 2;
                perimetro = (base * 2) + (altura * 2);
                htmlShape = `<div style="width:80px; height:40px; border:3px solid var(--gold); background:#fffbeb"></div>
                             <span class="measure-label" style="top:25%; left:50%">${base}u</span>
                             <span class="measure-label" style="top:50%; left:15%">${altura}u</span>`;
            } else { // Triángulo Equilátero
                const lado = Math.floor(Math.random() * 9) + 2;
                perimetro = lado * 3;
                htmlShape = `<svg width="80" height="70"><polygon points="40,5 5,65 75,65" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/></svg>
                             <span class="measure-label" style="bottom:10%; left:50%">${lado}u</span>
                             <span class="measure-label" style="top:40%; left:20%">${lado}u</span>`;
            }

            answersKey.push(perimetro);
            container.innerHTML += `
                <div class="problem-card">
                    <div class="shape-container">${htmlShape}</div>
                    <div class="input-area">P = <input type="number" id="v-${i}"> u</div>
                </div>
            `;
        }
    }

    function calcularNota() {
        let ok = 0;
        const resultsList = document.getElementById('print-results-list');
        resultsList.innerHTML = "";

        answersKey.forEach((ans, i) => {
            const v = parseInt(document.getElementById(`v-${i}`).value);
            const esCorrecto = v === ans;
            if(esCorrecto) ok++;
            resultsList.innerHTML += `<div class="report-row" style="font-family: Arial;">
                <span>Ejercicio ${i+1}: Perímetro = ${ans}</span>
                <span style="color:${esCorrecto?'green':'red'}">${esCorrecto?'✓':'✗ ('+v+')'}</span>
            </div>`;
        });

        const nota = ok * 2;
        document.getElementById('print-student-name').innerText = document.getElementById('student-name-input').value || "Invitado";
        document.getElementById('print-date').innerText = new Date().toLocaleDateString();
        document.getElementById('print-score').innerText = nota + " / 20";
        document.getElementById('print-feedback').innerText = nota >= 12 ? "¡Gran trabajo midiendo formas! 📐" : "Suma todos los lados con cuidado. 📏";
        document.getElementById('workshop').style.display = 'none';
        document.getElementById('print-view').style.display = 'block';
    }
</script>
</body>
</html>
