<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. UPRIT 2026 - Razonamiento Matemático</title>
    <style>
        :root {
            --primary: #4338ca;
            --success: #16a34a;
            --error: #dc2626;
            --gold: #f59e0b;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        #workshop {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        #print-view {
            display: none;
            background: white;
            width: 210mm; 
            min-height: 297mm;
            padding: 15mm;
            margin: auto;
            box-sizing: border-box;
        }

        .header-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            max-height: 180px;
            object-fit: cover;
        }

        .manual-name {
            text-align: left;
            margin-bottom: 20px;
            background: #f3f4f6;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .manual-name input {
            flex-grow: 1;
            border: none;
            border-bottom: 2px dotted #9ca3af;
            background: transparent;
            font-size: 1.1rem;
            padding: 5px;
            outline: none;
            color: var(--primary);
        }

        .problem-card {
            background: #f9fafb;
            border: 3px solid #f3f4f6;
            border-left: 8px solid var(--primary);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .story-text {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #1f2937;
            margin-bottom: 15px;
        }

        .answer-zone {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #fff;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        input[type="number"] {
            width: 80px;
            height: 45px;
            text-align: center;
            font-size: 1.3rem;
            border: 2px solid var(--primary);
            border-radius: 8px;
            outline: none;
            font-weight: bold;
        }

        .btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
            width: 100%;
        }

        .report-row {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            text-align: left;
        }

        @media print {
            body { background: white; padding: 0; }
            #workshop { display: none !important; }
            #print-view { display: block !important; }
            .no-print { display: none !important; }
            @page { margin: 1cm; }
        }
    </style>
</head>
<body onload="generarProblemas()">

    <div id="workshop">
        <img src="img/logo.jpg" alt="Banner" class="header-img">
        
        <div class="manual-name">
            <strong>Estudiante:</strong>
            <input type="text" id="student-name-input" placeholder="Escribe tu nombre aquí...">
        </div>

        <h2 style="color: var(--primary); margin-bottom: 5px;">Desafíos de Razonamiento</h2>
        <p style="font-size: 0.9rem; color: #666;">Lee con mucha atención y resuelve cada historia.</p>
        <p style="font-size: 0.9rem; color: #666;">Puntaje: 4 pts por acierto (Total 20)</p>

        <div id="exercise-container"></div>

        <button class="btn" onclick="corregir()">Entregar y Ver Nota</button>
        
        <div class="school-footer" style="margin-top:20px; font-size:0.8rem; color:#888;">
            I.E. UPRIT 2026
        </div>
    </div>

    <div id="print-view">
        <div style="text-align:center; border-bottom: 4px solid var(--primary); padding-bottom: 10px;">
            <h1 style="margin:0; color:var(--primary); font-family: Arial;">REPORTE DE EVALUACIÓN</h1>
            <h3 style="margin:5px 0; font-family: Arial;">I.E. UPRIT 2026 - Razonamiento Matemático</h3>
        </div>

        <div style="margin: 20px 0; font-family: Arial; display: flex; justify-content: space-between;">
            <span><strong>Estudiante:</strong> <span id="print-student-name"></span></span>
            <span><strong>Fecha:</strong> <span id="print-date"></span></span>
        </div>

        <h4 style="font-family: Arial; border-bottom: 1px solid #ccc; margin-bottom: 10px;">Resultados de los Desafíos:</h4>
        <div id="print-results-list"></div>

        <div style="margin-top: 20px; padding: 20px; border: 3px solid var(--gold); border-radius: 15px; text-align: center; font-family: Arial;">
            <h2 style="margin:0;">CALIFICACIÓN FINAL</h2>
            <div style="font-size: 4rem; font-weight: bold; color: var(--gold);" id="print-score">0 / 20</div>
            <p id="print-feedback" style="font-size: 1.2rem; font-weight: bold;"></p>
        </div>

        <div class="no-print" style="text-align:center; margin-top:30px;">
            <button class="btn" style="width:auto" onclick="window.print()">🖨️ Imprimir Reporte</button>
            <button class="btn" style="background:#6b7280; width:auto" onclick="location.reload()">Nuevo Examen</button>
        </div>
    </div>

<script>
    const nombres = ["Mateo", "Valentina", "Thiago", "Camila", "Luciana", "Santiago", "Emma"];
    const objetos = ["canicas", "manzanas", "carritos", "figuritas", "chocolates"];
    let soluciones = [];

    function generarProblemas() {
        const container = document.getElementById('exercise-container');
        container.innerHTML = "";
        soluciones = [];

        for(let i=0; i<5; i++) {
            const tipo = Math.floor(Math.random() * 4); 
            const n1 = Math.floor(Math.random() * 20) + 10;
            const n2 = Math.floor(Math.random() * 9) + 2;
            const nom = nombres[Math.floor(Math.random()*nombres.length)];
            const obj = objetos[Math.floor(Math.random()*objetos.length)];
            
            let texto = "";
            let respuesta = 0;

            switch(tipo) {
                case 0: // Suma
                    texto = `${nom} tiene ${n1} ${obj}. Su abuelito le regaló ${n2} ${obj} más. ¿Cuántos ${obj} tiene en total?`;
                    respuesta = n1 + n2;
                    break;
                case 1: // Resta
                    texto = `${nom} compró ${n1} ${obj}, pero en el camino perdió ${n2}. ¿Cuántos ${obj} le quedan ahora?`;
                    respuesta = n1 - n2;
                    break;
                case 2: // Multiplicación
                    const nSmall = Math.floor(Math.random()*5)+2;
                    const nBox = Math.floor(Math.random()*4)+2;
                    texto = `${nom} guardó sus ${obj} en ${nBox} cajas. Si en cada caja puso ${nSmall} ${obj}, ¿cuántos tiene en total?`;
                    respuesta = nSmall * nBox;
                    break;
                case 3: // División
                    const resDiv = Math.floor(Math.random()*5)+2;
                    const divisor = Math.floor(Math.random()*4)+2;
                    const dividendo = resDiv * divisor;
                    texto = `${nom} quiere repartir ${dividendo} ${obj} entre sus ${divisor} mejores amigos por igual. ¿Cuántos le toca a cada uno?`;
                    respuesta = resDiv;
                    break;
            }

            soluciones.push({ texto, respuesta, obj });
            container.innerHTML += `
                <div class="problem-card">
                    <div class="story-text"><strong>Desafío ${i+1}:</strong> ${texto}</div>
                    <div class="answer-zone">
                        <strong>Respuesta:</strong>
                        <input type="number" id="ans-${i}" placeholder="?">
                        <span>${obj}</span>
                    </div>
                </div>
            `;
        }
    }

    function corregir() {
        let aciertos = 0;
        const studentName = document.getElementById('student-name-input').value || "Invitado";
        const resultsList = document.getElementById('print-results-list');
        resultsList.innerHTML = "";

        soluciones.forEach((sol, i) => {
            const userAns = parseInt(document.getElementById(`ans-${i}`).value);
            const esCorrecto = userAns === sol.respuesta;
            if(esCorrecto) aciertos++;

            resultsList.innerHTML += `
                <div class="report-row" style="font-family: Arial;">
                    <div style="width: 75%;"><strong>${i+1}.</strong> ${sol.texto}</div>
                    <div style="width: 25%; text-align: right; color:${esCorrecto?'green':'red'}; font-weight:bold">
                        ${esCorrecto ? 'Correcto ✓' : 'Incorrecto (Era '+sol.respuesta+')'}
                    </div>
                </div>
            `;
        });

        const notaFinal = aciertos * 4;
        document.getElementById('print-student-name').innerText = studentName;
        document.getElementById('print-date').innerText = new Date().toLocaleDateString();
        document.getElementById('print-score').innerText = notaFinal + " / 20";
        
        const feedback = document.getElementById('print-feedback');
        if(notaFinal === 20) feedback.innerText = "¡FELICITACIONES! RAZONAMIENTO PERFECTO 🏆";
        else if(notaFinal >= 12) feedback.innerText = "¡Buen trabajo! Tienes buena lógica. 👍";
        else feedback.innerText = "Lee con más calma los problemas para entender la operación. 💪";

        document.getElementById('workshop').style.display = 'none';
        document.getElementById('print-view').style.display = 'block';
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
