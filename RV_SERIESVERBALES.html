<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. UPRIT 2026 - Series Verbales</title>
    <style>
        :root {
            --primary: #4338ca;
            --series: #ec4899;
            --success: #16a34a;
            --error: #dc2626;
            --gold: #f59e0b;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        #workshop {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        #print-view {
            display: none;
            background: white;
            width: 210mm; 
            min-height: 297mm;
            padding: 15mm;
            margin: auto;
            box-sizing: border-box;
        }

        .header-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            max-height: 180px;
            object-fit: cover;
        }

        .manual-name {
            text-align: left;
            margin-bottom: 20px;
            background: #fdf2f8;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #fbcfe8;
        }

        .manual-name input {
            flex-grow: 1;
            border: none;
            border-bottom: 2px dotted #f472b6;
            background: transparent;
            font-size: 1.1rem;
            padding: 5px;
            outline: none;
            color: var(--series);
        }

        .problem-card {
            background: #fff5f8;
            border: 2px solid #fce7f3;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: left;
        }

        .instruction-text {
            font-size: 1.1rem;
            color: #be185d;
            margin-bottom: 12px;
            display: block;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .opt-btn {
            background: white;
            border: 2px solid #f9a8d4;
            padding: 12px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Comic Sans MS';
            transition: 0.3s;
            font-size: 1rem;
            color: #333;
        }

        .opt-btn:hover { background: #fdf2f8; }
        .opt-btn.selected { background: var(--series); color: white; border-color: var(--series); }

        .btn-finish {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            margin: 20px 0;
            width: 100%;
        }

        .report-row {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        @media print {
            body { background: white; padding: 0; }
            #workshop { display: none !important; }
            #print-view { display: block !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body onload="cargarSeries()">

    <div id="workshop">
        <img src="img/logo.jpg" class="header-img">
        
        <div class="manual-name">
            <strong>Estudiante:</strong>
            <input type="text" id="student-name-input" placeholder="Escribe tu nombre...">
        </div>

        <h2 style="color: var(--series); margin: 0;">Series Verbales</h2>
        <p style="color: #666; margin-bottom: 20px;">🧐 ¡Encuentra la palabra que NO pertenece al grupo!</p>

        <div id="container"></div>

        <button class="btn-finish" onclick="corregir()">Finalizar Evaluación</button>
        
        <div style="margin-top:15px; font-size:0.8rem; color:#999;">I.E. UPRIT 2026</div>
    </div>

    <div id="print-view">
        <div style="text-align:center; border-bottom: 4px solid var(--series); padding-bottom: 10px;">
            <h1 style="margin:0; color:var(--series); font-family: Arial;">REPORTE DE EVALUACIÓN</h1>
            <h3 style="margin:5px 0; font-family: Arial;">I.E. UPRIT 2026 - Razonamiento Verbal</h3>
        </div>
        <div style="margin: 20px 0; font-family: Arial; display: flex; justify-content: space-between;">
            <span><strong>Estudiante:</strong> <span id="print-name"></span></span>
            <span><strong>Fecha:</strong> <span id="print-date"></span></span>
        </div>
        <div id="print-results"></div>
        <div style="margin-top: 20px; padding: 20px; border: 3px solid var(--gold); border-radius: 15px; text-align: center; font-family: Arial;">
            <h2 style="margin:0;">NOTA FINAL</h2>
            <div id="print-score" style="font-size: 4rem; font-weight: bold; color: var(--gold);"></div>
            <p id="print-feedback" style="font-size: 1.2rem; font-weight: bold;"></p>
        </div>
        <div class="no-print" style="text-align:center; margin-top:30px;">
            <button class="btn-finish" style="width:auto" onclick="window.print()">🖨️ Imprimir</button>
            <button class="btn-finish" style="background:#6b7280; width:auto" onclick="location.reload()">Nuevo Ejercicio</button>
        </div>
    </div>

<script>
    const bancoSeries = [
        { serie: "Manzana, Pera, Plátano...", opciones: ["Uva", "Lechuga", "Tomate", "Papa"], intrusa: "Lechuga" },
        { serie: "Perro, Gato, León, Tigre...", opciones: ["Lobo", "Mesa", "Zorro", "Oso"], intrusa: "Mesa" },
        { serie: "Rojo, Azul, Amarillo, Verde...", opciones: ["Blanco", "Dulce", "Negro", "Rosa"], intrusa: "Dulce" },
        { serie: "Lunes, Martes, Miércoles...", opciones: ["Jueves", "Viernes", "Enero", "Sábado"], intrusa: "Enero" },
        { serie: "Cuchara, Tenedor, Cuchillo...", opciones: ["Plato", "Vaso", "Peine", "Olla"], intrusa: "Peine" },
        { serie: "Margarita, Rosa, Girasol...", opciones: ["Clavel", "Pino", "Tulipán", "Orquídea"], intrusa: "Pino" },
        { serie: "Perú, Chile, Argentina, Colombia...", opciones: ["Lima", "Ecuador", "Bolivia", "Brasil"], intrusa: "Lima" },
        { serie: "Carpintero, Médico, Abogado...", opciones: ["Profesor", "Martillo", "Ingeniero", "Chef"], intrusa: "Martillo" },
        { serie: "Avión, Helicóptero, Avioneta...", opciones: ["Globo", "Pájaro", "Cohete", "Barco"], intrusa: "Barco" },
        { serie: "Ojo, Nariz, Boca, Oreja...", opciones: ["Mano", "Cara", "Zapato", "Cejas"], intrusa: "Zapato" }
    ];

    let elecciones = new Array(10).fill(null);

    function cargarSeries() {
        const cont = document.getElementById('container');
        bancoSeries.forEach((item, i) => {
            let optsHtml = "";
            // Mezclar opciones para que la intrusa no esté siempre en el mismo lugar
            const optsMezcladas = [...item.opciones].sort(() => Math.random() - 0.5);
            
            optsMezcladas.forEach(opt => {
                optsHtml += `<button class="opt-btn" onclick="seleccionar(${i}, '${opt}', this)">${opt}</button>`;
            });

            cont.innerHTML += `
                <div class="problem-card">
                    <span class="instruction-text">Serie ${i+1}: ${item.serie}</span>
                    <p style="margin:0 0 10px 0; font-size:0.9rem; color:#666;">¿Cuál es la palabra intrusa?</p>
                    <div class="options-grid">${optsHtml}</div>
                </div>
            `;
        });
    }

    function seleccionar(idx, valor, btn) {
        const hermanos = btn.parentElement.querySelectorAll('.opt-btn');
        hermanos.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        elecciones[idx] = valor;
    }

    function corregir() {
        let aciertos = 0;
        const resList = document.getElementById('print-results');
        resList.innerHTML = "";

        bancoSeries.forEach((item, i) => {
            const esCorrecto = elecciones[i] === item.intrusa;
            if(esCorrecto) aciertos++;
            resList.innerHTML += `
                <div class="report-row" style="font-family: Arial;">
                    <span style="width:70%">Grupo: <i>${item.serie}</i> | Marcó: <b>${elecciones[i] || '---'}</b></span>
                    <span style="color:${esCorrecto?'green':'red'}; font-weight:bold">${esCorrecto?'✓ Correcto':'✗ (La intrusa era: '+item.intrusa+')'}</span>
                </div>
            `;
        });

        const nota = aciertos * 2;
        document.getElementById('print-name').innerText = document.getElementById('student-name-input').value || "Invitado";
        document.getElementById('print-date').innerText = new Date().toLocaleDateString();
        document.getElementById('print-score').innerText = nota + " / 20";
        document.getElementById('print-feedback').innerText = nota >= 12 ? "¡Gran capacidad de clasificación! 🧐⭐" : "Sigue observando las características de los objetos. 📚";
        
        document.getElementById('workshop').style.display = 'none';
        document.getElementById('print-view').style.display = 'block';
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
