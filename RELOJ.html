<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. UPRIT 2026 - El Reloj</title>
    <style>
        :root {
            --primary: #4338ca;
            --success: #16a34a;
            --error: #dc2626;
            --gold: #f59e0b;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        #workshop {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        #print-view {
            display: none;
            background: white;
            width: 210mm; 
            min-height: 297mm;
            padding: 15mm;
            margin: auto;
            box-sizing: border-box;
        }

        .header-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            max-height: 180px;
            object-fit: cover;
        }

        .manual-name {
            text-align: left;
            margin-bottom: 20px;
            background: #f3f4f6;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .manual-name input {
            flex-grow: 1;
            border: none;
            border-bottom: 2px dotted #9ca3af;
            background: transparent;
            font-size: 1.1rem;
            padding: 5px;
            outline: none;
            color: var(--primary);
        }

        .problem-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .problem-card {
            background: #f9fafb;
            border: 3px solid #f3f4f6;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* DISEÑO DEL RELOJ */
        .clock {
            width: 100px;
            height: 100px;
            border: 4px solid #333;
            border-radius: 50%;
            position: relative;
            background: white;
            margin-bottom: 10px;
        }

        .clock::after { /* Centro */
            content: '';
            width: 6px;
            height: 6px;
            background: #333;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            background: #333;
            border-radius: 4px;
        }

        .hour-hand { width: 4px; height: 30px; }
        .min-hand { width: 3px; height: 45px; background: var(--error); }

        /* INPUTS HORA */
        .time-input-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .time-input-container input {
            width: 45px;
            height: 40px;
            text-align: center;
            font-size: 1.2rem;
            border: 2px solid #9ca3af;
            border-radius: 8px;
        }

        .btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            margin: 20px;
        }

        #print-results-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 30px;
            margin: 20px 0;
        }

        .report-row {
            border-bottom: 1px solid #eee;
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
        }

        @media print {
            body { background: white; padding: 0; }
            #workshop { display: none !important; }
            #print-view { display: block !important; }
            .no-print { display: none !important; }
            @page { margin: 1cm; }
        }
    </style>
</head>
<body onload="crearExamen()">

    <div id="workshop">
        <img src="img/logo.jpg" class="header-img">
        
        <div class="manual-name">
            <strong>Estudiante:</strong>
            <input type="text" id="student-name-input" placeholder="Escribe tu nombre aquí...">
        </div>

        <h2 style="color: var(--primary); margin-bottom: 5px;">Aprendiendo la Hora</h2>
        <p style="font-size: 0.9rem; color: #666;">Observa los relojes y escribe la hora digital.</p>

        <div id="exercise-container" class="problem-grid"></div>

        <button class="btn" id="btn-finish" onclick="calcularNota()">Entregar y Ver Nota</button>
        
        <div class="school-footer" style="margin-top:20px; font-size:0.8rem; color:#888;">
            I.E. UPRIT 2026
        </div>
    </div>

    <div id="print-view">
        <div style="text-align:center; border-bottom: 4px solid var(--primary); padding-bottom: 10px;">
            <h1 style="margin:0; color:var(--primary); font-family: Arial;">REPORTE DE EVALUACIÓN</h1>
            <h3 style="margin:5px 0; font-family: Arial;">I.E. UPRIT 2026 - Unidades de Tiempo</h3>
        </div>

        <div style="margin: 20px 0; font-family: Arial; display: flex; justify-content: space-between;">
            <span><strong>Estudiante:</strong> <span id="print-student-name"></span></span>
            <span><strong>Fecha:</strong> <span id="print-date"></span></span>
        </div>

        <h4 style="font-family: Arial; border-bottom: 1px solid #ccc; margin-bottom: 10px;">Resultados de los 10 ejercicios:</h4>
        <div id="print-results-list"></div>

        <div style="margin-top: 20px; padding: 20px; border: 3px solid var(--gold); border-radius: 15px; text-align: center; font-family: Arial;">
            <h2 style="margin:0;">CALIFICACIÓN FINAL</h2>
            <div style="font-size: 4rem; font-weight: bold; color: var(--gold);" id="print-score">0 / 20</div>
            <p id="print-feedback" style="font-size: 1.2rem; font-weight: bold;"></p>
        </div>

        <div class="no-print" style="text-align:center; margin-top:30px;">
            <button class="btn" onclick="window.print()">🖨️ Imprimir Reporte</button>
            <button class="btn" style="background:#6b7280" onclick="location.reload()">Nuevo Examen</button>
        </div>
    </div>

<script>
    let answersKey = [];

    function crearExamen() {
        const container = document.getElementById('exercise-container');
        container.innerHTML = "";
        answersKey = [];

        for(let i=0; i<10; i++) {
            const hora = Math.floor(Math.random() * 12) + 1;
            const minutos = Math.random() > 0.5 ? 0 : 30; // Solo horas en punto o medias horas
            
            // Cálculo de grados para las manecillas
            // Cada hora son 30 grados. Para las 12 se usa 0.
            const degMin = minutos * 6; // 0 o 180
            const degHora = (hora * 30) + (minutos === 30 ? 15 : 0);

            answersKey.push({ hora, minutos });

            container.innerHTML += `
                <div class="problem-card">
                    <div class="clock">
                        <div class="hand hour-hand" style="transform: translateX(-50%) rotate(${degHora}deg)"></div>
                        <div class="hand min-hand" style="transform: translateX(-50%) rotate(${degMin}deg)"></div>
                    </div>
                    <div class="time-input-container">
                        <input type="number" id="vH-${i}" placeholder="HH">
                        <span style="font-weight:bold">:</span>
                        <input type="number" id="vM-${i}" placeholder="MM">
                    </div>
                </div>
            `;
        }
    }

    function calcularNota() {
        let ejerciciosCorrectos = 0;
        const studentName = document.getElementById('student-name-input').value || "Invitado";
        const resultsList = document.getElementById('print-results-list');
        resultsList.innerHTML = ""; 

        answersKey.forEach((key, i) => {
            const vH = parseInt(document.getElementById(`vH-${i}`).value);
            const vM = parseInt(document.getElementById(`vM-${i}`).value);

            const esCorrecto = (vH === key.hora && vM === key.minutos);
            if(esCorrecto) ejerciciosCorrectos++;

            const hFormat = key.hora.toString().padStart(2, '0');
            const mFormat = key.minutos.toString().padStart(2, '0');
            const vHFormat = isNaN(vH) ? '??' : vH.toString().padStart(2, '0');
            const vMFormat = isNaN(vM) ? '??' : vM.toString().padStart(2, '0');

            resultsList.innerHTML += `
                <div class="report-row" style="font-family: Arial;">
                    <span>Reloj ${i+1}: ${vHFormat}:${vMFormat}</span>
                    <span style="color:${esCorrecto ? 'green' : 'red'}; font-weight:bold">
                        ${esCorrecto ? '✓' : '✗ (Era ' + hFormat + ':' + mFormat + ')'}
                    </span>
                </div>
            `;
        });

        const notaFinal = ejerciciosCorrectos * 2;
        document.getElementById('print-student-name').innerText = studentName;
        document.getElementById('print-date').innerText = new Date().toLocaleDateString();
        document.getElementById('print-score').innerText = notaFinal + " / 20";
        
        const feedback = document.getElementById('print-feedback');
        if(notaFinal === 20) feedback.innerText = "¡PUNTUALIDAD PERFECTA! ⏰🏆";
        else if(notaFinal >= 12) feedback.innerText = "¡Buen trabajo! Sigue practicando las horas. 👍";
        else feedback.innerText = "Recuerda: la manecilla corta es la hora y la larga los minutos. 💪";

        document.getElementById('workshop').style.display = 'none';
        document.getElementById('print-view').style.display = 'block';
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
